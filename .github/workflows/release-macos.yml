name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag or RC label for acceptance checklist metadata."
        required: false
        type: string
      rc_checklist_promotion_path:
        description: "Optional path in the checked-out ref to a completed RC checklist; omitted runs fail closed on the generated TODO template."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-notarized:
    name: Build signed notarized macOS artifact
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate signed release contract
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          node scripts/release/validate-release-contract.mjs \
            --config build/package/release-macos.json \
            --expected-channel release \
            --check-env

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['test:coverage', 'rc:byok-fixture-smoke'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing workflow scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Check public docs
        run: pnpm docs:check

      - name: Build docs site
        run: pnpm docs:build

      - name: Check versions
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      - name: Browser visual regression
        run: pnpm test:visual:browser

      - name: Performance smoke
        run: pnpm perf:smoke

      - name: Security check
        run: pnpm security:check

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-${{ github.job }}-${{ github.run_attempt }}
          path: dist/visual-regression/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Run desktop Electron E2E
        run: pnpm e2e:desktop

      - name: Run desktop accessibility E2E
        run: pnpm e2e:desktop:a11y

      - name: Upload desktop E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: tmp/playwright/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/htmlslide-developer-id.p12"
          keychain_path="$RUNNER_TEMP/htmlslide-signing.keychain-db"

          CERTIFICATE_PATH="$certificate_path" python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_DEVELOPER_ID_CERTIFICATE_BASE64"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          if ! grep -Fq "\"$APPLE_DEVELOPER_ID_APPLICATION\"" <<<"$identity_output"; then
            echo "::error title=Developer ID identity mismatch::The imported keychain does not contain APPLE_DEVELOPER_ID_APPLICATION."
            exit 1
          fi

      - name: Package signed notarized release
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HTMLSLIDE_RELEASE_CHANNEL: release
        run: pnpm package:release:macos

      - name: Validate signed release manifest
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          manifest="$(find dist/release -maxdepth 1 -type f -name 'HTMLslide-*.json' -print | sort | tail -n 1)"
          if [[ -z "$manifest" ]]; then
            echo "::error title=Missing release manifest::package:release:macos must write a JSON manifest to dist/release."
            exit 1
          fi

          node scripts/release/validate-release-contract.mjs \
            --manifest "$manifest" \
            --expected-arch arm64 \
            --team-id "$APPLE_TEAM_ID"

      - name: Verify signed release security evidence
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          manifest="$(find dist/release -maxdepth 1 -type f -name 'HTMLslide-*.json' -print | sort | tail -n 1)"
          dmg="$(find dist/release -maxdepth 1 -type f -name '*.dmg' -print | sort | tail -n 1)"
          evidence="$(find dist/release -maxdepth 1 -type f -name 'release-security-evidence-*.json' -print | sort | tail -n 1)"
          if [[ -z "$manifest" || -z "$dmg" || -z "$evidence" || ! -d dist/release/HTMLslide.app ]]; then
            echo "::error title=Missing release security inputs::Expected the signed app, DMG, manifest, and security evidence under dist/release."
            exit 1
          fi

          pnpm release:security:verify -- \
            --app dist/release/HTMLslide.app \
            --dmg "$dmg" \
            --manifest "$manifest" \
            --evidence "$evidence" \
            --identity "$APPLE_DEVELOPER_ID_APPLICATION" \
            --team-id "$APPLE_TEAM_ID" \
            --bundle-identifier app.htmlslide

      - name: Contract-only external-agent verifier smoke (fixture only; no real compatibility evidence)
        shell: bash
        run: |
          set -euo pipefail

          manifest_dir="dist/release"
          evidence_input="docs/examples/external-agent-rc-evidence-input.json"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          output_path="$RUNNER_TEMP/htmlslide-release-external-agent-contract-smoke.json"

          if [[ ! -f "$evidence_input" ]]; then
            echo "::error title=Missing external-agent contract fixture::The fixed external-agent RC evidence input is missing: $evidence_input"
            exit 1
          fi

          if [[ ! -d "$manifest_dir" ]]; then
            echo "::error title=Missing release manifest directory::The preceding package step did not create $manifest_dir."
            exit 1
          fi

          manifest="$(find "$manifest_dir" -maxdepth 1 -type f -name 'HTMLslide-*.json' -print | sort | tail -n 1)"
          if [[ -z "$manifest" || ! -f "$manifest" ]]; then
            echo "::error title=Missing release package manifest::The preceding package step did not write a JSON manifest under $manifest_dir."
            exit 1
          fi

          pnpm rc:external-agent-evidence -- \
            --evidence "$evidence_input" \
            --package-manifest "$manifest" \
            --commit "$GITHUB_SHA" \
            --artifact-url "$run_url" \
            --output "$output_path"

          if [[ ! -s "$output_path" ]]; then
            echo "::error title=Missing external-agent verifier output::The sanitized external-agent evidence file was not written to $output_path."
            exit 1
          fi

      - name: Contract-only BYOK fixture smoke (fixture only; no real provider acceptance)
        run: pnpm rc:byok-fixture-smoke

      - name: Smoke signed notarized release package
        env:
          HTMLSLIDE_PACKAGE_SMOKE_CHANNEL: release
          HTMLSLIDE_PACKAGE_SMOKE_DIR: dist/release
        run: pnpm smoke:package:alpha

      - name: Collect release artifacts
        shell: bash
        env:
          WORKFLOW_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          WORKFLOW_RC_CHECKLIST_PROMOTION_PATH: ${{ github.event.inputs.rc_checklist_promotion_path || '' }}
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          external_agent_evidence="$RUNNER_TEMP/htmlslide-release-external-agent-contract-smoke.json"
          if [[ ! -s "$external_agent_evidence" ]]; then
            echo "::error title=Missing external-agent evidence artifact::The sanitized verifier output is missing from $external_agent_evidence."
            exit 1
          fi
          cp "$external_agent_evidence" release-artifacts/

          byok_fixture_evidence="$RUNNER_TEMP/htmlslide-byok-fixture-evidence.json"
          if [[ ! -s "$byok_fixture_evidence" ]]; then
            echo "::error title=Missing BYOK fixture evidence artifact::The fixture-only BYOK smoke output is missing from $byok_fixture_evidence."
            exit 1
          fi
          cp "$byok_fixture_evidence" release-artifacts/

          shopt -s nullglob
          artifacts=(dist/release/*.dmg dist/release/*.json)

          if (( ${#artifacts[@]} == 0 )); then
            echo "::error title=No release artifacts::No release DMG or manifest was found under dist/release."
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            cp "$artifact" release-artifacts/
          done

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_tag="$WORKFLOW_RELEASE_TAG"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$release_tag" ]]; then
            release_tag="manual-${GITHUB_RUN_NUMBER}"
          fi
          pnpm rc:checklist -- \
            --channel release \
            --ci-run-url "$run_url" \
            --package-run-url "$run_url" \
            --artifact-url "htmlslide-signed-notarized-${GITHUB_RUN_NUMBER}" \
            --release-tag "$release_tag" \
            --output release-artifacts/HTMLslide-release-rc-acceptance.md

          generated_checklist="release-artifacts/HTMLslide-release-rc-acceptance.md"
          cp "$generated_checklist" release-artifacts/HTMLslide-release-rc-acceptance-template.md

          if [[ -n "$WORKFLOW_RC_CHECKLIST_PROMOTION_PATH" ]]; then
            if [[ ! -f "$WORKFLOW_RC_CHECKLIST_PROMOTION_PATH" ]]; then
              echo "::error title=Missing RC checklist promotion input::The supplied path is not a regular file: $WORKFLOW_RC_CHECKLIST_PROMOTION_PATH"
              exit 1
            fi

            repo_root="$(git rev-parse --show-toplevel)"
            promotion_path="$(cd "$(dirname "$WORKFLOW_RC_CHECKLIST_PROMOTION_PATH")" && pwd)/$(basename "$WORKFLOW_RC_CHECKLIST_PROMOTION_PATH")"
            case "$promotion_path" in
              "$repo_root"/*) ;;
              *)
                echo "::error title=Unsafe RC checklist promotion input::The supplied checklist must remain inside the checked-out repository."
                exit 1
                ;;
            esac

            cp "$promotion_path" "$generated_checklist"
          fi

          find release-artifacts -type f -print | sort

      - name: Verify RC checklist promotion gate (fail closed)
        shell: bash
        run: |
          set -euo pipefail

          checklist="release-artifacts/HTMLslide-release-rc-acceptance.md"
          if [[ ! -f "$checklist" ]]; then
            echo "::error title=Missing RC checklist::The release checklist was not generated at $checklist."
            exit 1
          fi

          echo "Verifying RC checklist promotion evidence; unresolved TODO placeholders remain a hard failure."
          pnpm rc:checklist:verify -- --checklist "$checklist"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm release:notes -- --tag "${GITHUB_REF_NAME}" --output release-artifacts/RELEASE_NOTES.md

      - name: Upload signed notarized artifact
        uses: actions/upload-artifact@v7
        with:
          name: htmlslide-signed-notarized-${{ github.run_number }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "HTMLslide $tag" --notes-file release-artifacts/RELEASE_NOTES.md
          else
            gh release edit "$tag" --title "HTMLslide $tag" --notes-file release-artifacts/RELEASE_NOTES.md
          fi

          gh release upload "$tag" release-artifacts/* --clobber

      - name: Delete signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/htmlslide-signing.keychain-db" >/dev/null 2>&1 || true
