name: Deck rendering bug
description: Report HTML/PDF/PNG output differences or visual regressions.
title: "[Rendering]: "
labels:
  - rendering
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Rendering issue
      description: Describe the visible problem and where it appears.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha, package artifact name, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output affected
      options:
        - Preview
        - PDF
        - PNG thumbnail
        - deckpkg
        - Presenter
        - Multiple outputs
    validations:
      required: true
  - type: textarea
    id: deck
    attributes:
      label: Minimal deck fixture
      description: Attach or link the smallest deck/project that reproduces the rendering issue, with private content removed.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and artifacts
      description: Include the exact command or UI path and the relevant artifact names.
      placeholder: |
        htmlslide check <project> --json
        htmlslide export <project> --pdf --html --deckpkg --thumbnails --json
        exports/<name>.pdf, exports/<name>.deckpkg, exports/thumbnails/...
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected rendering
      description: What should the preview, PDF, thumbnail, deckpkg, or presenter output show?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual rendering
      description: What is visibly wrong? Include page/slide number and selector when known.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or diffs
      description: Include before, after, and diff images when available.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS version, Chromium/Electron version if known
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      description: Public rendering reports must use sanitized fixtures and artifacts.
      options:
        - label: I removed API keys, provider tokens, private deck content, personal data, and unreleased customer material.
          required: true
