name: External agent integration bug
description: Report issues with Claude, Codex, Gemini, fake adapters, or MCP boundaries.
title: "[External Agent]: "
labels:
  - external-agent
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What integration failed?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha, package artifact name, or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS version, CPU architecture, Node version, external agent CLI version if known
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - fake adapter
        - Claude Code
        - Codex
        - Gemini CLI
        - Other external agent
        - MCP server
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: Which path exposed the issue?
      options:
        - New Deck generation
        - Opened workspace Generate
        - Check / repair
        - Export gate
        - MCP tool call
        - External command setup
        - Provider validation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, UI path, selected workspace, and sanitized agent settings. Remove credentials and private project data.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the agent/provider/MCP path have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact error messages, stage name, run id, or tool name when available.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Project boundary or file-write behavior
      description: Note whether the agent tried to read or write outside the selected project.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste sanitized diagnostics that help maintainers locate the failure. Write "Not applicable" only when no command or report exists.
      placeholder: |
        htmlslide doctor --json
        htmlslide agent validate-provider ... --json
        .htmlslide/reports/latest-agent-run.json summary with secrets removed
        MCP --status or --list-tools output
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove API keys, bearer tokens, raw provider prompts, private deck content, and personal data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      description: Public integration reports must not include secrets, private decks, raw provider prompts, or local-only confidential paths.
      options:
        - label: I removed API keys, provider tokens, bearer tokens, private deck content, personal data, and unreleased customer material.
          required: true
