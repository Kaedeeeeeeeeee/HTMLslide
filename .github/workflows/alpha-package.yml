name: Alpha Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/alpha-package.yml"
      - "apps/desktop/**"
      - "build/package/**"
      - "packages/**"
      - "packages/cli/**"
      - "packages/compiler/**"
      - "packages/core/**"
      - "packages/renderer/**"
      - "scripts/release/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: alpha-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-alpha:
    name: Build unsigned alpha artifact
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate release package contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error title=Missing package.json::Alpha packaging expects a root package.json with pnpm scripts: docs:check, docs:build, version:check, lint, typecheck, test, test:coverage, perf:smoke, security:check, build, package:alpha, smoke:package:alpha, rc:checklist, rc:external-agent-evidence, rc:byok-fixture-smoke."
            exit 1
          fi

          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error title=Missing pnpm-lock.yaml::Alpha packaging uses pnpm install --frozen-lockfile."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['docs:check', 'docs:build', 'version:check', 'lint', 'typecheck', 'test', 'test:coverage', 'test:visual:browser', 'perf:smoke', 'security:check', 'build', 'e2e:desktop', 'e2e:desktop:a11y', 'package:alpha', 'smoke:package:alpha', 'rc:checklist', 'rc:external-agent-evidence', 'rc:byok-fixture-smoke'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing release scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!pkg.packageManager || !pkg.packageManager.startsWith('pnpm@')) {
            console.warn('::warning title=Missing packageManager::Pin pnpm with packageManager, for example "pnpm@9.x".');
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and verify Poppler
        run: |
          if ! brew list --versions poppler >/dev/null 2>&1; then
            brew install poppler
          fi
          command -v pdftoppm
          pdftoppm -v

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Check public docs
        run: pnpm docs:check

      - name: Build docs site
        run: pnpm docs:build

      - name: Check versions
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      - name: Browser visual regression
        run: pnpm test:visual:browser

      - name: Performance smoke
        run: pnpm perf:smoke

      - name: Security check
        run: pnpm security:check

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ github.job }}-${{ github.run_attempt }}
          path: dist/visual-regression/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Run desktop Electron E2E
        run: pnpm e2e:desktop

      - name: Run desktop accessibility E2E
        run: pnpm e2e:desktop:a11y

      - name: Upload desktop E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: tmp/playwright/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Package unsigned alpha
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          HTMLSLIDE_RELEASE_CHANNEL: alpha
        run: pnpm package:alpha

      - name: Contract-only external-agent verifier smoke (fixture only; no real compatibility evidence)
        shell: bash
        run: |
          set -euo pipefail

          manifest_dir="dist/alpha"
          evidence_input="docs/examples/external-agent-rc-evidence-input.json"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          output_path="$RUNNER_TEMP/htmlslide-alpha-external-agent-contract-smoke.json"

          if [[ ! -f "$evidence_input" ]]; then
            echo "::error title=Missing external-agent contract fixture::The fixed external-agent RC evidence input is missing: $evidence_input"
            exit 1
          fi

          if [[ ! -d "$manifest_dir" ]]; then
            echo "::error title=Missing alpha manifest directory::The preceding package step did not create $manifest_dir."
            exit 1
          fi

          manifest="$(find "$manifest_dir" -maxdepth 1 -type f -name 'HTMLslide-*.json' -print | sort | tail -n 1)"
          if [[ -z "$manifest" || ! -f "$manifest" ]]; then
            echo "::error title=Missing alpha package manifest::The preceding package step did not write a JSON manifest under $manifest_dir."
            exit 1
          fi

          pnpm rc:external-agent-evidence -- \
            --evidence "$evidence_input" \
            --package-manifest "$manifest" \
            --commit "$GITHUB_SHA" \
            --artifact-url "$run_url" \
            --output "$output_path"

          if [[ ! -s "$output_path" ]]; then
            echo "::error title=Missing external-agent verifier output::The sanitized external-agent evidence file was not written to $output_path."
            exit 1
          fi

      - name: Contract-only BYOK fixture smoke (fixture only; no real provider acceptance)
        run: pnpm rc:byok-fixture-smoke

      - name: Smoke unsigned alpha package
        run: pnpm smoke:package:alpha

      - name: Collect package artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="dist/alpha"

          if [[ ! -d "$artifact_dir" ]]; then
            echo "::error title=Missing alpha artifact directory::pnpm package:alpha must write unsigned alpha artifacts to dist/alpha."
            exit 1
          fi

          shopt -s nullglob
          dmgs=("$artifact_dir"/*.dmg)
          zips=("$artifact_dir"/*.zip)
          manifest="$(find "$artifact_dir" -maxdepth 1 -type f -name 'HTMLslide-*.json' -print | sort | tail -n 1)"
          artifacts=("$artifact_dir"/*.dmg "$artifact_dir"/*.zip "$artifact_dir"/*.json "$artifact_dir"/*.blockmap)

          if (( ${#dmgs[@]} == 0 )) || [[ -z "$manifest" || ! -f "$manifest" ]]; then
            echo "::error title=Missing alpha DMG::pnpm package:alpha completed but no DMG was found under dist/alpha."
            exit 1
          fi

          if (( ${#zips[@]} == 0 )); then
            echo "::error title=Missing alpha ZIP::pnpm package:alpha completed but no ZIP was found under dist/alpha."
            exit 1
          fi

          mkdir -p alpha-artifacts

          external_agent_evidence="$RUNNER_TEMP/htmlslide-alpha-external-agent-contract-smoke.json"
          if [[ ! -s "$external_agent_evidence" ]]; then
            echo "::error title=Missing external-agent evidence artifact::The sanitized verifier output is missing from $external_agent_evidence."
            exit 1
          fi
          cp "$external_agent_evidence" alpha-artifacts/

          byok_fixture_evidence="$RUNNER_TEMP/htmlslide-byok-fixture-evidence.json"
          if [[ ! -s "$byok_fixture_evidence" ]]; then
            echo "::error title=Missing BYOK fixture evidence artifact::The fixture-only BYOK smoke output is missing from $byok_fixture_evidence."
            exit 1
          fi
          cp "$byok_fixture_evidence" alpha-artifacts/

          for artifact in "${artifacts[@]}"; do
            cp "$artifact" alpha-artifacts/
          done

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          pnpm rc:checklist -- \
            --channel alpha \
            --ci-run-url "$run_url" \
            --package-run-url "$run_url" \
            --artifact-url "htmlslide-unsigned-alpha-${GITHUB_RUN_NUMBER}" \
            --package-manifest "$manifest" \
            --commit "$GITHUB_SHA" \
            --output alpha-artifacts/HTMLslide-alpha-rc-acceptance.md

          count="$(find alpha-artifacts -type f | wc -l | tr -d ' ')"
          if [[ "$count" == "0" ]]; then
            echo "::error title=No package artifacts::pnpm package:alpha completed but no alpha artifacts were copied from dist/alpha."
            exit 1
          fi

          find alpha-artifacts -type f -print | sort

      - name: Upload unsigned alpha artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: htmlslide-unsigned-alpha-${{ github.run_number }}
          path: alpha-artifacts/*
          if-no-files-found: error
          retention-days: 14
