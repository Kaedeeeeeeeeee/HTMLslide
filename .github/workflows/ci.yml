name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-checks:
    name: pnpm install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error title=Missing package.json::CI expects a root package.json with packageManager set to pnpm and scripts: docs:check, lint, typecheck, test, build."
            exit 1
          fi

          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error title=Missing pnpm-lock.yaml::CI uses pnpm install --frozen-lockfile; commit pnpm-lock.yaml with the app scaffold."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['docs:check', 'lint', 'typecheck', 'test', 'build', 'e2e:desktop'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing npm scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!pkg.packageManager || !pkg.packageManager.startsWith('pnpm@')) {
            console.warn('::warning title=Missing packageManager::Pin pnpm with packageManager, for example "pnpm@9.x".');
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public docs
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.job }}-${{ github.run_attempt }}
          path: dist/visual-regression/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm build

  desktop-e2e:
    name: Desktop Electron E2E
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate desktop E2E contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error title=Missing package.json::Desktop E2E expects a root package.json with packageManager set to pnpm and script: e2e:desktop."
            exit 1
          fi

          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error title=Missing pnpm-lock.yaml::Desktop E2E uses pnpm install --frozen-lockfile."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['e2e:desktop'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing desktop E2E scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!pkg.packageManager || !pkg.packageManager.startsWith('pnpm@')) {
            console.warn('::warning title=Missing packageManager::Pin pnpm with packageManager, for example "pnpm@9.x".');
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop Electron E2E
        run: pnpm e2e:desktop
