name: Docs Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate docs publish contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error title=Missing package.json::Docs publishing expects root package scripts: docs:check and docs:build."
            exit 1
          fi

          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error title=Missing pnpm-lock.yaml::Docs publishing uses pnpm install --frozen-lockfile."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['docs:check', 'docs:build'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing docs scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!pkg.packageManager || !pkg.packageManager.startsWith('pnpm@')) {
            console.warn('::warning title=Missing packageManager::Pin pnpm with packageManager, for example "pnpm@9.x".');
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public docs
        run: pnpm docs:check

      - name: Build docs site
        run: pnpm docs:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/docs-site
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
