name: Alpha Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: alpha-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-alpha:
    name: Build unsigned alpha artifact
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release package contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error title=Missing package.json::Alpha packaging expects a root package.json with pnpm scripts: lint, typecheck, test, build, package:alpha."
            exit 1
          fi

          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error title=Missing pnpm-lock.yaml::Alpha packaging uses pnpm install --frozen-lockfile."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const requiredScripts = ['lint', 'typecheck', 'test', 'build', 'package:alpha'];
          const missing = requiredScripts.filter((name) => !pkg.scripts || !pkg.scripts[name]);

          if (missing.length > 0) {
            console.error(`::error title=Missing release scripts::Add package.json scripts: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!pkg.packageManager || !pkg.packageManager.startsWith('pnpm@')) {
            console.warn('::warning title=Missing packageManager::Pin pnpm with packageManager, for example "pnpm@9.x".');
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package unsigned alpha
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          HTMLSLIDE_RELEASE_CHANNEL: alpha
        run: pnpm package:alpha

      - name: Collect package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .alpha-artifacts

          while IFS= read -r artifact; do
            cp "$artifact" .alpha-artifacts/
          done < <(
            find dist release out build -maxdepth 4 -type f \
              \( -name "*.dmg" -o -name "*.zip" -o -name "*.pkg" -o -name "*.tar.gz" -o -name "*.blockmap" \) \
              2>/dev/null | sort
          )

          count="$(find .alpha-artifacts -type f | wc -l | tr -d ' ')"
          if [[ "$count" == "0" ]]; then
            echo "::error title=No package artifacts::pnpm package:alpha completed but no DMG/ZIP/PKG/TAR artifacts were found under dist/, release/, out/, or build/."
            exit 1
          fi

          find .alpha-artifacts -type f -maxdepth 1 -print | sort

      - name: Upload unsigned alpha artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlslide-unsigned-alpha-${{ github.run_number }}
          path: .alpha-artifacts/*
          if-no-files-found: error
          retention-days: 14
